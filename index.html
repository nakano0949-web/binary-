<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Binary Encoding Tool (Fast Version)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; }
    h1 { font-size: 1.4rem; }
    label { display: block; margin-top: 10px; }
    input[type="number"], textarea {
      width: 100%; padding: 6px; box-sizing: border-box; font-family: monospace;
    }
    button { margin-top: 8px; padding: 6px 12px; }
    .section { border: 1px solid #ccc; padding: 12px; margin-bottom: 16px; border-radius: 6px; }
    .result { margin-top: 8px; font-family: monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Binary Encoding / Decoding</h1>

  <!-- Encode -->
  <div class="section">
    <h2>Encoding（m, n → binary）</h2>
    <label>m:</label>
    <input type="number" id="m_input" min="1" value="238">
    <label>n:</label>
    <input type="number" id="n_input" min="1" value="23147">
    <button onclick="handleEncode()">Encoding</button>
    <div class="result" id="encode_result"></div>
  </div>

  <!-- Decode -->
  <div class="section">
    <h2>Decoding（binary → m, n）</h2>
    <label>bit（0/1）:</label>
    <textarea id="bits_input" rows="3">01111100101000100101001</textarea>
    <button onclick="handleDecode()">Decoding</button>
    <div class="result" id="decode_result"></div>
  </div>

  <script>
/* -------------------------
   正しい Fast Möbius Encoding
   （遅い版と完全一致する高速版）
   ------------------------- */

function encodeMobius(m, n) {
  m = BigInt(m);
  n = BigInt(n);

  const bits = [];

  while (m !== n) {
    if (m > n) {
      // ★ 正しい Fast 版：q = floor((m-1)/n)
      const q = (m - 1n) / n;
      bits.push("1".repeat(Number(q)));
      m = m - q * n;
    } else {
      // ★ 正しい Fast 版：q = floor((n-1)/m)
      const q = (n - 1n) / m;
      bits.push("0".repeat(Number(q)));
      n = n - q * m;
    }
  }

  return bits.reverse().join("");
}

/* -------------------------
   Decoding（遅い版と同じ）
   ------------------------- */

function decodeMobius(binaryStr) {
  const s = binaryStr.trim();
  if (s.length === 0) throw new Error("ビット列が空です");

  let m = 1n, n = 1n;

  for (const bit of s) {
    if (bit === "1") {
      m = m + n;
    } else if (bit === "0") {
      n = n + m;
    } else {
      throw new Error("0/1 以外の文字が含まれています");
    }
  }

  return { m, n };
}

/* -------------------------
   UI handlers
   ------------------------- */

function handleEncode() {
  const mVal = document.getElementById("m_input").value;
  const nVal = document.getElementById("n_input").value;
  const out = document.getElementById("encode_result");

  try {
    const code = encodeMobius(mVal, nVal);
    out.textContent = `code = ${code}\nlength = ${code.length}`;
  } catch (e) {
    out.textContent = `エラー: ${e.message}`;
  }
}

function handleDecode() {
  const bits = document.getElementById("bits_input").value;
  const out = document.getElementById("decode_result");

  try {
    const { m, n } = decodeMobius(bits);
    const codeBack = encodeMobius(m, n);

    out.textContent =
      `m/n = ${m.toString()}/${n.toString()}\n` +
      `再エンコード = ${codeBack}\n` +
      `一致 = ${codeBack === bits.trim()}`;
  } catch (e) {
    out.textContent = `エラー: ${e.message}`;
  }
}
  </script>
</body>
</html>
